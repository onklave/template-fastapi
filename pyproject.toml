[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Onklave project template: Python FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
# Constrained, not frozen: floors keep generated apps off known-old releases,
# ceilings stop a surprise major (e.g. starlette 0.x -> 1.x) breaking a build
# months from now. Patch/minor security fixes still flow in automatically.
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.52.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  # starlette's TestClient uses httpx2; plain httpx is deprecated there.
  "httpx2>=2.9.1,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
